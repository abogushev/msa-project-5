apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-exporter
  namespace: data-export
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: exporter
              image: data-exporter:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: export-config
                      key: db-host
                - name: DB_PORT
                  valueFrom:
                    secretKeyRef:
                      name: export-config
                      key: db-port
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: export-config
                      key: db-name
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: db-user
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: db-password
                - name: EXPORT_PATH
                  valueFrom:
                    secretKeyRef:
                      name: export-config
                      key: export-path
                - name: LOG_LEVEL
                  valueFrom:
                    configMapKeyRef:
                      name: exporter-config
                      key: LOG_LEVEL
              volumeMounts:
                - name: export-data
                  mountPath: /data/exports
          volumes:
            - name: export-data
              persistentVolumeClaim:
                claimName: export-data-pvc
